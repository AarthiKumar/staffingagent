name: staffing-agent
region: nyc

# Database
databases:
  - name: db
    engine: PG
    version: "15"
    size: basic-xs
    num_nodes: 1
    production: true

# Backend Service
services:
  - name: backend
    # Source configuration
    github:
      repo: AarthiKumar/staffingagent
      branch: main
      deploy_on_push: true

    # Build configuration
    source_dir: /backend
    dockerfile_path: backend/Dockerfile

    # Runtime configuration
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs

    # Health check
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    # Environment variables
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

      - key: AUTH0_ENABLED
        scope: RUN_TIME
        value: "true"

      - key: AUTH0_DOMAIN
        scope: RUN_TIME
        value: ""  # Set this in Digital Ocean UI
        type: SECRET

      - key: AUTH0_CLIENT_ID
        scope: RUN_TIME
        value: ""  # Set this in Digital Ocean UI
        type: SECRET

      - key: AUTH0_CLIENT_SECRET
        scope: RUN_TIME
        value: ""  # Set this in Digital Ocean UI
        type: SECRET

      - key: AUTH0_AUDIENCE
        scope: RUN_TIME
        value: "https://api.staffingagent.com"

      - key: AUTH0_CALLBACK_URL
        scope: RUN_TIME
        value: "https://staffingagent.com/callback"

      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: "https://staffingagent.com,https://www.staffingagent.com"

      - key: EMBEDDINGS_PROVIDER
        scope: RUN_TIME
        value: "sentence_transformers"

      - key: EMBEDDINGS_MODEL
        scope: RUN_TIME
        value: "all-MiniLM-L6-v2"

    # Run command
    run_command: uvicorn app.main:app --host 0.0.0.0 --port 8000

# Frontend Service
static_sites:
  - name: frontend
    # Source configuration
    github:
      repo: AarthiKumar/staffingagent
      branch: main
      deploy_on_push: true

    # Build configuration
    source_dir: /frontend
    dockerfile_path: frontend/Dockerfile

    # Build command
    build_command: npm run build

    # Output directory
    output_dir: dist

    # Environment variables (build time)
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: "${backend.PUBLIC_URL}/api/v1"

      - key: VITE_AUTH0_ENABLED
        scope: BUILD_TIME
        value: "true"

      - key: VITE_AUTH0_DOMAIN
        scope: BUILD_TIME
        value: ""  # Set this in Digital Ocean UI
        type: SECRET

      - key: VITE_AUTH0_CLIENT_ID
        scope: BUILD_TIME
        value: ""  # Set this in Digital Ocean UI
        type: SECRET

      - key: VITE_AUTH0_AUDIENCE
        scope: BUILD_TIME
        value: "https://api.staffingagent.com"

      - key: VITE_AUTH0_REDIRECT_URI
        scope: BUILD_TIME
        value: "https://staffingagent.com/callback"

    # Routing
    routes:
      - path: /

    # Error document (for SPA routing)
    error_document: index.html

# Jobs (for migrations)
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: AarthiKumar/staffingagent
      branch: main
    source_dir: /backend
    dockerfile_path: backend/Dockerfile
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
    run_command: alembic upgrade head
