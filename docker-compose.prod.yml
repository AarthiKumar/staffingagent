version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: staffing-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_DB: ${DB_NAME:-staffing}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/init_pgvector.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-staffing}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - staffing-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: staffing-backend-prod
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-staffing}

      # Auth0
      AUTH0_ENABLED: ${AUTH0_ENABLED:-true}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?Auth0 domain required}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:?Auth0 client ID required}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:?Auth0 client secret required}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.staffingagent.com}
      AUTH0_CALLBACK_URL: ${AUTH0_CALLBACK_URL}

      # Application
      APP_NAME: ${APP_NAME:-Staffing Agent}
      CORS_ORIGINS: ${CORS_ORIGINS}

      # Embeddings
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-sentence_transformers}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-all-MiniLM-L6-v2}

      # Storage
      MINIO_ENABLED: ${MINIO_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - staffing-network
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_AUTH0_ENABLED: ${VITE_AUTH0_ENABLED:-true}
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE:-https://api.staffingagent.com}
        VITE_AUTH0_REDIRECT_URI: ${VITE_AUTH0_REDIRECT_URI}
    container_name: staffing-frontend-prod
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - staffing-network

networks:
  staffing-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  backend_data:
    driver: local
